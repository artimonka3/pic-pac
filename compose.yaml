services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: picpac
      POSTGRES_USER: picpac
      POSTGRES_PASSWORD: picpac
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - picpac-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picpac -d picpac"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  picpac-db:
